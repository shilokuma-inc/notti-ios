name: Upload/release

# Secrets (EXPORT_OPTIONS / APPLE_API_KEY_BASE64 / APPLE_API_KEY_ID /
# APPLE_API_ISSUER_ID / APPLE_ID / APP_SPECIFIC_PASSWORD) が未設定のため、
# 自動実行は止めて手動実行のみにしている。設定後に push トリガーへ戻す。
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive
        run: |
          xcodebuild archive \
                     -project notti.xcodeproj \
                     -scheme notti \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     -archivePath "$GITHUB_WORKSPACE/build.xcarchive" \
                     CODE_SIGNING_ALLOWED=NO

      - name: Create ExportOptions.plist
        run: |
          echo '${{ secrets.EXPORT_OPTIONS }}' > ExportOptions.plist

      - name: Create Private Key
        run: |
          mkdir private_keys
          echo -n '${{ secrets.APPLE_API_KEY_BASE64 }}' | base64 --decode > ./private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
                     -archivePath build.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath app.ipa \
                     -allowProvisioningUpdates \
                     -authenticationKeyPath `pwd`/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8 \
                     -authenticationKeyID ${{ secrets.APPLE_API_KEY_ID }} \
                     -authenticationKeyIssuerID ${{ secrets.APPLE_API_ISSUER_ID }}
          ipa_path=$(ls app.ipa/*.ipa | head -1)
          echo "IPA_PATH=$ipa_path" >> $GITHUB_ENV
          echo "APP_NAME=$(basename "$ipa_path" .ipa)" >> $GITHUB_ENV

      - name: Upload IPA file to App Store Connect
        run: |
          xcrun altool --upload-app -f "${{ env.IPA_PATH }}" \
                      -u ${{ secrets.APPLE_ID }} \
                      -p ${{ secrets.APP_SPECIFIC_PASSWORD }} \
                      --type ios

      - name: Upload IPA file to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}.ipa
          path: ${{ env.IPA_PATH }}
