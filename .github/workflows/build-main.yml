name: Build/main

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build & Test
        run: |
          xcodebuild test -project notti.xcodeproj -scheme notti -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" -derivedDataPath build


on:
  push:
    branches: main

jobs:
  build:
    name: main
    runs-on: macos-latest

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4

      - name: ci_post_clone
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Set Environment
        run: |
          package_dir=$(ls -d *.swiftpm | head -1)
          scheme=$(cd "$package_dir" && xcodebuild -list -json 2>/dev/null | ruby -rjson -e 'puts JSON.parse(STDIN.read)["workspace"]["schemes"][0]')
          echo "PACKAGE_DIR=$package_dir" >> $GITHUB_ENV
          echo "SCHEME=$scheme" >> $GITHUB_ENV
          echo "Using package: $package_dir / scheme: $scheme"

      - name: Build
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          xcodebuild build-for-testing \
                     -scheme "$SCHEME" \
                     -destination 'generic/platform=iOS Simulator'
