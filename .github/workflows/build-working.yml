name: Build

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!develop'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build & Test
        run: |
          xcodebuild test -project notti.xcodeproj -scheme notti -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" -derivedDataPath build
