name: Archive

# Archive → IPA Export まで通ることを確認する（アップロードはしない）。
# IPA Export に Upload と同じ Secrets が必要で、未設定のあいだは手動実行のみにしている。
# 設定後は template-app-ios と同じく main への push をトリガーに戻す。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    uses: ./.github/workflows/_archive.yml
    with:
      upload: false
    secrets: inherit
