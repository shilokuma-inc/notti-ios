name: Upload

# Archive → IPA Export → App Store Connect へアップロードする。
# 署名とアップロードに必要な Secrets (EXPORT_OPTIONS / APPLE_API_KEY_BASE64 /
# APPLE_API_KEY_ID / APPLE_API_ISSUER_ID) が未設定のため、自動実行は止めて手動実行のみにしている。
# 設定後は template-app-ios と同じく develop / release/** への push をトリガーに戻す。
on:
  workflow_dispatch:

permissions:
  contents: read

# アップロード途中でキャンセルすると App Store Connect 側に中途半端なビルドが残るため、
# 実行中のものは完了させる
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    uses: ./.github/workflows/_archive.yml
    with:
      upload: true
    secrets: inherit
