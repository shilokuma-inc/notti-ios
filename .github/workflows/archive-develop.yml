name: Archive/develop

on:
  push:
    branches: [develop]

jobs:
  archive:
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build & Archive
        run: |
          xcodebuild archive -project notti.xcodeproj -scheme notti -destination 'generic/platform/iOS' -configuration Release -archivePath ${{ github.workspace }}/build.xcarchive CODE_SIGNING_ALLOWED=NO
